<!-- @format -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card - Jefferson Dacillo</title>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400;1,600&family=Montserrat:wght@300;400;500;600&display=swap");

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Montserrat", sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        /* Gray Background Canvas */
        background: radial-gradient(
          circle at center,
          #9ca3af 0%,
          #6b7280 60%,
          #4b5563 100%
        );
        padding: 15px;
      }

      .profile-card {
        background: #111111;
        margin: 25px;
        max-width: 500px;
        border-radius: 16px;
        padding: 50px 40px;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .profile-card:hover {
        transform: translateY(-4px);
        border-color: rgba(255, 255, 255, 0.25);
        box-shadow: 0 28px 50px rgba(0, 0, 0, 0.55);
      }

      .avatar {
        width: 95px;
        height: 95px;
        border-radius: 50%;
        object-fit: cover;
        filter: none;
        border: 2px solid rgba(255, 255, 255, 0.8);
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3);
        margin-bottom: 20px;
      }

      .profile-name {
        font-family: "Montserrat", sans-serif;
        font-size: 0.95rem;
        font-weight: 600;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #ffffff;
        margin-bottom: 6px;
      }

      /* Title: Soft Muted Gray */
      .profile-title {
        font-family: "Cormorant Garamond", serif;
        font-style: italic;
        font-size: 0.95rem;
        font-weight: 400;
        color: #9ca3af;
        letter-spacing: 0.08em;
        margin-bottom: 18px;
      }

      /* Bio: Off-White / Light Gray */
      .profile-bio {
        font-size: 0.8rem;
        line-height: 1.65;
        color: #e5e7eb;
        font-weight: 300;
        letter-spacing: 0.02em;
        margin-bottom: 28px;
      }

      .contact-btn {
        display: block;
        width: 100%;
        padding: 12px 0;
        background: #ffffff;
        color: #000000;
        text-decoration: none;
        font-family: "Montserrat", sans-serif;
        font-weight: 600;
        font-size: 0.7rem;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        border-radius: 8px;
        border: 1px solid #ffffff;
        transition: all 0.3s ease;
      }

      .contact-btn:hover {
        background: #d1d5db;
        border-color: #d1d5db;
      }
    </style>
  </head>
  <body>
    <main class="profile-card">
      <img
        src="miles.jpg?auto=format&fit=crop&q=80&w=300"
        alt="Jefferson Dacillo Profile Picture"
        class="avatar"
      />

      <h1 class="profile-name">JEFFERSON DACIILO</h1>

      <p class="profile-title">Full Stack Developer</p>

      <p class="profile-bio">
        A dedicated Students with a passion for learning new technologies and
        crafting seamless user experiences across both frontend and backend
        development - "About You" By 1975 inspired!
      </p>

      <a
        href="https://www.facebook.com/jefferson.dacillo.31"
        target="_blank"
        rel="noopener"
        class="contact-btn"
        >GET IN TOUCH</a
      >
    </main>
  </body>
</html>
